databaseChangeLog:

  - changeSet:
      id: 010-create-task-comments
      author: zodiakk

      changes:
        - createTable:
            tableName: task_comments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: task_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: author_employee_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: task_comments
            baseColumnNames: task_id
            referencedTableName: project_tasks
            referencedColumnNames: id
            constraintName: fk_task_comment_task
