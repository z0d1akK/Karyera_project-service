databaseChangeLog:

  - changeSet:
      id: 014-create-project-milestones
      author: zodiakk

      changes:
        - createTable:
            tableName: project_milestones
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: project_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: due_date
                  type: DATE
              - column:
                  name: completed_date
                  type: DATE
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: project_milestones
            baseColumnNames: project_id
            referencedTableName: projects
            referencedColumnNames: id
            constraintName: fk_project_milestone_project

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE project_milestones ADD CONSTRAINT chk_project_milestone_dates CHECK (completed_date IS NULL OR due_date IS NULL OR completed_date >= due_date);
